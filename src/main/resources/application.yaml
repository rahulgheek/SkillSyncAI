spring:
  config:
    import: "optional:file:./.env.properties"
  application:
    name: skillsync-ai

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  profiles:
    active: dev
  datasource:
    url: "${DB_NAME}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SkillSyncPool
      # Keep the pool at zero connections while the app is idle so Neon can
      # suspend the compute instead of being kept awake by pool maintenance.
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 300000
      # Do not replace healthy connections on a timer; replacement would open
      # a brand-new connection and wake Neon even when nobody is using the app.
      max-lifetime: 0
      keepalive-time: 0
      connection-timeout: 30000
      validation-timeout: 5000
      data-source-properties:
        # Neon is far away (hundreds of ms per round-trip). Rewriting inserts
        # into multi-row VALUES statements keeps batch writes fast.
        reWriteBatchedInserts: true
  sql:
    init:
      # schema.sql enables PostgreSQL extensions that entity mappings rely on.
      # It runs before Hibernate creates or validates the schema.
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          create_namespaces: true
        # Batch lazy collection/entity initialisation instead of issuing one
        # query per row. This is the single biggest win on a high-latency DB.
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        query:
          in_clause_parameter_padding: true
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@skillsync.edu}}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Never hold a database transaction open for minutes because the
          # SMTP relay is slow or unreachable.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  data:
    redis:
      # Unused when app.kv.store=cacheify (Cacheify backs OTP / OAuth2 exchange codes /
      # rate limiting over its HTTPS API instead). Only the default redis backend
      # (local or Upstash) actually connects through here.
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    ssl:
      trust-store-location: ${KAFKA_TRUST_STORE_LOCATION:classpath:ca.pem}
      trust-store-type: PEM
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

server:
  port: ${PORT:8080}

gemini:
  api:
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
    key: ${GEMINI_API_KEY}

groq:
  api:
    url: "https://api.groq.com/openai/v1/chat/completions"
    key: ${GROQ_API_KEY}

cacheify:
  base-url: ${CACHEIFY_BASE_URL:https://cacheify.bot-keep.xyz}
  database-id: ${CACHEIFY_DB_ID:rdb_15d6788f-6d67-4b4f-af71-427a475358ca}
  api-key: ${CACHEIFY_API_KEY:}

app:
  kv:
    # Backend for all Redis-style state (OTP storage, OAuth2 exchange codes, rate limiting):
    # redis (default) | cacheify. Legacy OTP_STORE env var is still honored when KV_STORE is unset.
    store: ${KV_STORE:${OTP_STORE:redis}}
  frontend:
    oauth2-redirect-url: ${FRONTEND_URL:http://localhost:5173}/oauth2/callback