spring:
  config:
    import: "optional:file:./.env.properties"
  application:
    name: skillsync-ai

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  profiles:
    active: dev
  datasource:
    url: "${DB_NAME}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SkillSyncPool
      # Keep the pool at zero connections while the app is idle so Neon can
      # suspend the compute instead of being kept awake by pool maintenance.
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 300000
      # Do not replace healthy connections on a timer; replacement would open
      # a brand-new connection and wake Neon even when nobody is using the app.
      max-lifetime: 0
      keepalive-time: 0
      connection-timeout: 30000
      validation-timeout: 5000
      data-source-properties:
        # Neon is far away (hundreds of ms per round-trip). Rewriting inserts
        # into multi-row VALUES statements keeps batch writes fast.
        reWriteBatchedInserts: true
  sql:
    init:
      # schema.sql enables PostgreSQL extensions that entity mappings rely on.
      # It runs before Hibernate creates or validates the schema.
      mode: always
  jpa:
    # This is a JSON API with no server-side view rendering. Transactions are
    # owned by services, so a lazy association must never be initialised while
    # the response is being serialised. Keeping OSIV off also prevents an
    # EntityManager (and a pooled connection) from being held for the whole
    # request, which matters on a high-latency remote database.
    open-in-view: false
    hibernate:
      # `update` lets Hibernate create the new matching job table and indexes.
      # For a production deployment with multiple instances, replace this with
      # versioned migrations once the schema stabilizes.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
        # Batch lazy collection/entity initialisation instead of issuing one
        # query per row. This is the single biggest win on a high-latency DB.
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        query:
          in_clause_parameter_padding: true
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@skillsync.edu}}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Never hold a database transaction open for minutes because the
          # SMTP relay is slow or unreachable.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  data:
    redis:
      # Unused when app.kv.store=cacheify (Cacheify backs OTP / OAuth2 exchange codes /
      # rate limiting over its HTTPS API instead). Only the default redis backend
      # (local or Upstash) actually connects through here.
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    ssl:
      trust-store-location: ${KAFKA_TRUST_STORE_LOCATION:classpath:ca.pem}
      trust-store-type: PEM
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

server:
  port: ${PORT:8080}

gemini:
  api:
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
    key: ${GEMINI_API_KEY}

groq:
  api:
    url: "https://api.groq.com/openai/v1/chat/completions"
    key: ${GROQ_API_KEY}
    # The model is configurable so the scoring model can be swapped without a
    # redeploy. Structured scoring does not need the largest model.
    model: ${GROQ_API_MODEL:llama-3.1-70b-versatile}
    timeout-seconds: ${GROQ_API_TIMEOUT_SECONDS:20}
    max-retries: ${GROQ_API_MAX_RETRIES:1}

matching:
  shortlist:
    # Maximum number of candidates returned by the single SQL shortlist query.
    max-candidates: ${MATCHING_SHORTLIST_MAX_CANDIDATES:50}
  ai:
    # Only this many shortlisted candidates are sent to the LLM for re-ranking.
    max-candidates: ${MATCHING_AI_MAX_CANDIDATES:20}
    # Only this many shortlisted projects are sent to the LLM for a student.
    max-projects: ${MATCHING_AI_MAX_PROJECTS:10}
    # Re-use a READY result when the project inputs have not changed.
    cooldown-minutes: ${MATCHING_AI_COOLDOWN_MINUTES:10}
  job:
    # A RUNNING job older than this is treated as crashed and can be retried.
    stale-minutes: ${MATCHING_JOB_STALE_MINUTES:10}

cacheify:
  base-url: ${CACHEIFY_BASE_URL:https://cacheify.bot-keep.xyz}
  database-id: ${CACHEIFY_DB_ID:rdb_15d6788f-6d67-4b4f-af71-427a475358ca}
  api-key: ${CACHEIFY_API_KEY:}

app:
  kv:
    # Backend for all Redis-style state (OTP storage, OAuth2 exchange codes, rate limiting):
    # redis (default) | cacheify. Legacy OTP_STORE env var is still honored when KV_STORE is unset.
    store: ${KV_STORE:${OTP_STORE:redis}}
  frontend:
    oauth2-redirect-url: ${FRONTEND_URL:http://localhost:5173}/oauth2/callback